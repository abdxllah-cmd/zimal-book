<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>SOMETHING FOR SOMEONE VERY SPECIAL...</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #4a2a18 0%,
            #241207 55%,
            #120904 100%
        );

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    padding: 12px 20px;

    gap: 16px;

    overflow: hidden;
}


/* =========================================================
   BOOK STAGE
========================================================= */

.stage-container {
    width: 100%;
    max-width: 1050px;
    height: min(650px, calc(100svh - 110px));
    min-height: 420px;

    perspective: 2800px;
}


/* =========================================================
   HARD COVER
========================================================= */

.book-binding {

    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    background:
        linear-gradient(
            135deg,
            #651d20,
            #451014 45%,
            #2d090b
        );

    border-radius:
        9px 18px 18px 9px;

    padding: 10px;

    box-shadow:

        0 35px 70px rgba(0,0,0,.75),

        0 15px 25px rgba(0,0,0,.5),

        inset 0 0 18px rgba(0,0,0,.55);

    transform:
        rotateX(8deg)
        rotateY(-1deg);
}


/* leather texture */

.book-binding::before {

    content: "";

    position: absolute;

    inset: 4px;

    border-radius: 8px 15px 15px 8px;

    pointer-events: none;

    opacity: .15;

    background-image:
        radial-gradient(
            rgba(255,255,255,.4) .7px,
            transparent .7px
        );

    background-size: 5px 5px;
}


/* =========================================================
   PAPER STACK
========================================================= */

.paper-stack {

    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    background: #e5d5b9;

    border-radius:
        5px 12px 12px 5px;

    box-shadow:

        inset -3px 0 0 #c8b897,
        inset 3px 0 0 #c8b897,

        0 1px 0 #f2e5cf,
        0 2px 0 #aa9a7d,
        0 3px 0 #f2e5cf,
        0 4px 0 #aa9a7d,
        0 5px 0 #f2e5cf,
        0 6px 0 #aa9a7d,
        0 7px 0 #f2e5cf,
        0 8px 0 #95856b;
}


/* =========================================================
   SPINE
========================================================= */

.spine-shadow {

    position: absolute;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 50px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,

            rgba(0,0,0,.28),

            rgba(0,0,0,.07) 25%,

            transparent 50%,

            rgba(0,0,0,.07) 75%,

            rgba(0,0,0,.28)
        );

    pointer-events: none;

    z-index: 50;
}


/* =========================================================
   UNIVERSAL PAGE
========================================================= */

.page {

    width: 50%;
    height: 100%;

    position: absolute;

    top: 0;

    color: #2b2118;

    line-height: 1.6;

    font-size: 1rem;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.4),
            transparent 70%
        ),
        #fffaf0;

    overflow: hidden;
}


/* paper grain */

.page::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .22;

    background-image:
        radial-gradient(
            rgba(80,60,40,.12) .55px,
            transparent .55px
        );

    background-size: 5px 5px;
}


/* =========================================================
   STATIC LEFT / RIGHT
========================================================= */

.base-left {

    left: 0;

    border-radius:
        4px 0 0 4px;

    padding:
        50px 65px 50px 60px;

    background:
        linear-gradient(
            to right,
            #fffaf0 88%,
            #e4d6bb
        );
}


.base-right {

    left: auto;

    right: 0;

    border-radius:
        0 10px 10px 0;

    padding:
        50px 60px 50px 65px;

    background:
        linear-gradient(
            to left,
            #fffaf0 88%,
            #e4d6bb
        );
}


/* =========================================================
   FLIPPING SHEET
========================================================= */

.flip-sheet {

    position: absolute;

    top: 0;
    right: 0;

    width: 50%;
    height: 100%;

    transform-origin:
        left center;

    transform-style: preserve-3d;

    transition:
        transform 1s
        cubic-bezier(.45,0,.15,1);

    z-index: 20;
}


.flip-sheet.flipped {

    transform:
        rotateY(-180deg);
}


/* =========================================================
   SHEET FRONT
========================================================= */

.sheet-front {

    width: 100%;
    height: 100%;

    position: absolute;

    top: 0;
    left: 0;

    padding:
        50px 60px 50px 65px;

    border-radius:
        0 10px 10px 0;

    background:
        linear-gradient(
            to left,
            #fffaf0 88%,
            #e4d6bb
        );

    backface-visibility:
        hidden;

    transform:
        rotateY(0deg);

    z-index: 2;
}


/* =========================================================
   SHEET BACK
========================================================= */

.sheet-back {

    width: 100%;
    height: 100%;

    position: absolute;

    top: 0;
    left: 0;

    padding:
        50px 65px 50px 60px;

    border-radius:
        4px 0 0 4px;

    background:
        linear-gradient(
            to right,
            #fffaf0 88%,
            #e4d6bb
        );

    backface-visibility:
        hidden;

    transform:
        rotateY(180deg);

    z-index: 1;
}


/* =========================================================
   PAGE NUMBERS
========================================================= */

.page-counter {

    position: absolute;

    bottom: 22px;

    font-size: .75rem;

    letter-spacing: 2px;

    color: #9c8d76;

    z-index: 5;
}


.base-left .page-counter,
.sheet-back .page-counter {

    left: 30px;
}


.base-right .page-counter,
.sheet-front .page-counter {

    right: 30px;
}


/* =========================================================
   HEADINGS
========================================================= */

.chapter-heading {

    text-align: center;

    font-weight: normal;

    font-variant:
        small-caps;

    letter-spacing: 3px;

    font-size: 1.35rem;

    color: #4a2b16;

    margin-bottom: 28px;

    padding-bottom: 10px;

    border-bottom:
        1px double #d4c5a9;
}


.section-title {

    text-align: center;

    font-size: 1.5rem;

    color: #6b2528;

    letter-spacing: 2px;

    margin-bottom: 28px;
}


.section-title span {

    color: #a08055;
}


.first-list-heading {

    font-size: clamp(1.05rem, 1.8vw, 1.35rem);

    line-height: 1.25;

    letter-spacing: 1px;

    margin-bottom: 20px;
}


/* =========================================================
   COVER
========================================================= */

.cover {

    padding: 0 !important;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #7a292d,
            #51171a 60%,
            #300b0d
        );
}


/* cover border */

.cover::before {

    content: "";

    position: absolute;

    inset: 20px;

    border:
        1px solid
        rgba(226,196,140,.5);

    z-index: 3;
}


.cover-small {

    color:
        #d7bb8c;

    font-family:
        Georgia,
        serif;

    font-size: .72rem;

    letter-spacing: 5px;

    text-transform:
        uppercase;

    margin-bottom: 25px;
}


.cover-heart {

    font-size: 60px;

    color: #ead7b1;

    margin-bottom: 20px;
}


.cover h1 {

    color: #f6e7cb;

    font-size:
        clamp(35px,5vw,62px);

    line-height: 1;

    font-weight: normal;
}


.cover-line {

    width: 70px;

    height: 1px;

    background: #c6a66d;

    margin: 28px 0;
}


.cover-sub {

    color: #d8bea0;

    font-style: italic;

    font-size: 1rem;
}


.cover-countdown-label {
    margin-top: 30px;
    color: #d7bb8c;
    font-size: .68rem;
    letter-spacing: 3px;
    text-transform: uppercase;
}


.cover-countdown {
    margin-top: 8px;
    color: #f6e7cb;
    font-family: Arial, sans-serif;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
}


.closed-cover {

    position: absolute;

    top: 0;

    right: 0;

    bottom: 0;

    left: 0;

    z-index: 3000;

    width: 100%;

    height: 100%;

    border-radius: 12px;

    box-shadow: inset 0 0 35px rgba(0,0,0,.45);

    backface-visibility: hidden;

    transform-origin: left center;

    transition: transform 1s cubic-bezier(.45,0,.15,1);
}


.closed-cover.opened {

    transform: rotateY(-180deg);

    pointer-events: none;
}


.inside-cover {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.inside-cover h1 {

    max-width: 100%;

    color: #64272a;

    font-size: clamp(1.5rem, 2.5vw, 2.2rem);

    font-weight: normal;

    line-height: 1.35;
}


.inside-cover h1 span {

    color: #8b454b;

    font-style: italic;
}


.inside-cover p {

    margin-top: 18px;

    color: #9b8970;

    font-style: italic;
}


/* =========================================================
   BIRTHDAY WISH
========================================================= */

.birthday {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.birthday-symbol {

    font-size: 24px;

    color: #8d4a4f;

    margin-bottom: 12px;
}


.birthday h1 {

    font-weight: normal;

    font-size: clamp(1.4rem, 2.1vw, 1.75rem);

    color: #64272a;

    margin-bottom: 25px;
}


.birthday p {

    max-width: 420px;

    font-size: 1rem;

    line-height: 1.8;

    text-align: center;

    color: #4b4036;
}


.closing-wish .birthday-symbol {
    margin-bottom: 5px;
}


.closing-wish h1 {
    margin-bottom: 12px;
}


.closing-wish p {

.closing-wish .birthday-sign {

.personal-letter .birthday-symbol {

.personal-letter h1 {

.personal-letter p {

    font-size: .78rem;
    line-height: 1.35;

.personal-letter .birthday-sign {

}


.final-declaration h1 {

    line-height: 1.15;
}

    font-style: italic;

    color: #9b8970;
}


/* =========================================================
   LIST
========================================================= */

.things {

    display: flex;

    flex-direction: column;

    justify-content: center;

    height: 100%;
}


.thing {

    display: flex;

    align-items: flex-start;

.number {

    padding-top: 2px;

    font-family:
        Arial,
        sans-serif;

    font-weight: bold;
}


.thing-text {

    flex: 1;
}


/* =========================================================
   SINGLE 95–100
========================================================= */

.single {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.single-number {

    font-family:
        Arial,
        sans-serif;

    font-size: .72rem;

    letter-spacing: 5px;

    color: #9c7952;

    margin-bottom: 35px;
}


.single-number::before,
.single-number::after {

    content: "—";

    margin: 0 12px;

    color: #c4a474;
}


.single-text {

    max-width: 430px;

    font-size:

.single-heart {

}

}


/* =========================================================
   BLANK PAGE
========================================================= */

.blank-page {

    background:
        #fffaf0;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation-dock {

    display: flex;

    align-items: center;

    gap: 20px;

    background:
        rgba(0,0,0,.35);

    padding:
        10px 20px;

    border-radius:
        50px;

    backdrop-filter:
        blur(8px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.4);
}


.dock-btn {

    background:
        #e2d2b5;

    color:
        #3d2314;

    border:
        1px solid #bda885;

    padding:
        11px 24px;

    font-family:
        Georgia,
        serif;

    font-size: .8rem;

    text-transform:
        uppercase;

    letter-spacing:
        1px;

    cursor:
        pointer;

    border-radius:
        25px;

    transition:
        .25s;
}


.dock-btn:hover:not(:disabled) {

    background:
        #fffaf0;

    transform:
        translateY(-2px);
}


.dock-btn:disabled {

    opacity: .35;

    cursor:
        not-allowed;
}


.page-status {

    color:
        #dbcdb4;

    font-size: .75rem;

    min-width: 80px;

    text-align: center;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:820px) {

    body {

        background:
            #1b0d07;

        padding: 15px;

        overflow-y: auto;

        justify-content: flex-start;
    }


    .stage-container {

        height: auto;

        perspective: none;
    }


    .book-binding {

        height: auto;

        transform: none;

        background: none;

        padding: 0;

        box-shadow: none;
    }


    .paper-stack {

        height: auto;

        background: none;

        box-shadow: none;
    }


    .spine-shadow {

        display: none;
    }


    .page {

        position: relative;

        width: 100%;

        height: auto;

        min-height: 500px;

        display: block;

        margin-bottom: 15px;

        border-radius: 5px !important;

        padding: 40px 25px !important;

        box-shadow:
            0 8px 20px
            rgba(0,0,0,.3);
    }


    .flip-sheet {

        position: relative;

        width: 100%;

        height: auto;

        display: block;

        transform: none !important;
    }


    .sheet-front,
    .sheet-back {

        position: relative;

        width: 100%;

        height: auto;

        min-height: 500px;

        transform: none;

        border-radius: 5px !important;

        margin-bottom: 15px;

        padding: 40px 25px !important;
    }


    .cover {

        min-height: 600px;
    }


    .navigation-dock {

        margin-bottom: 20px;
    }
}

</style>
</head>

    <p>Idk how to put all of this into “alfaaz”, but just know that my love and care for you can’t really be “bayaan” in words. When I’m writing this, I’m writing it with nothing but pure feelings and care for you.</p>

    <p>I hope this year brings you so much happiness. I hope this year grants you the things you’ve been wishing for. I hope you get what you want. I hope your mental health is really good this year. And I hope you never lose anyone you genuinely want to keep in your life.</p>

    <p>If you ever want me to do something, I’m always there, Zeemal. I’ve never said “no” to you, I’ve never lied to you, and I’ve never refused to tell you anything. And I hope that never changes.</p>
`;
}


function closingWishThirdPageContent() {

return `
    <div class="birthday-symbol">✦</div>

    <h1>One More Thing</h1>

    <p>Yesterday you asked me what I was doing, and I said I was making something. I’m sorry I refused to tell you 😭 but it was this book. This thing had me fighting for my life with all the complexity and animations typeshi 😭🙏</p>

    <p>And Zeemal, I want you to do one thing for me:</p>

    <p><strong>Whenever I ask you if you’re good, just be honest with me.</strong></p>

    <p>No matter how bad I am. No matter if I’m not doing good at that moment. I’ll always be there for you. The idk 5 months? They felt like the best days to me, I know... but hours feels like minutes with you.. and minutes feels like hours without you. I am so freaking grateful to have you... I am grateful that I sent you follow request from spam although not knowing who you. It was all (destiny🙃). I dont have much to say... cuz words cant define my love, care, and happiness for you..</p>

    <div class="birthday-sign">With lots of umm efforts n love 🫶 </div>
`;
}


function listContent(start, end) {

const heading = start === 0
    ? "100 Things Out of a Million I Like About You"
    : `Things <span>${start + 1}–${end}</span>`;

let html = `
    <h2 class="section-title ${start === 0 ? "first-list-heading" : ""}">
        ${heading}
    </h2>
`;

for(let i = start; i < end; i++) {

html += `
    <div class="thing">
        <span class="number">
            ${i + 1}.
        </span>

        <span class="thing-text">
            ${things[i]}
        </span>
    </div>
`;

}

return html;
}


function singleContent(index) {

return `
    <div class="single-number">
        ${index + 1}
    </div>

    <div class="single-text">
        ${things[index]}
    </div>

    <div class="single-heart">
        ♡
    </div>
`;
}


function blankContent() {
    return "";
}


/* =========================================================
   PAGE DATA
========================================================= */

const pages = [];
/* INSIDE COVER */

pages.push({
    content: insideCoverContent(),
    className: "inside-cover",
    name: "Inside Cover"
});


/* BIRTHDAY */


/* BIRTHDAY */

pages.push({
    content: birthdayContent(),
    className: "birthday",
    name: "Birthday"
});


/* 100 THINGS, IN ORDER */

for(let start = 0; start < 100; start += 10) {

    pages.push({
        content: listContent(start, start + 10),
        className: "things",
        name: `${start + 1}–${start + 10}`
    });

}


/* CLOSING BIRTHDAY WISH */

pages.push({
    content: closingWishContent(),
    className: "birthday closing-wish personal-letter",
    name: "Birthday Wish"
});


pages.push({
    content: closingWishSecondPageContent(),
    className: "birthday closing-wish personal-letter",
    name: "Birthday Wish, Continued"
});


pages.push({
    content: closingWishThirdPageContent(),
    className: "birthday closing-wish personal-letter",
    name: "Birthday Wish, Final Page"
});


pages.push({
    content: `
        <div class="birthday-symbol">♡</div>
        <h1>I LOVE YOU SO MUCH ZEEMALL!!!</h1>
    `,
    className: "birthday final-declaration",
    name: "I Love You"
});


/* =========================================================
   PAGE RENDERER
========================================================= */

function renderPage(element, page, side) {

    element.className =
        `page ${page.className}`;

    element.innerHTML =
        page.content;

    element.dataset.name =
        page.name;

    element.style.display =
        "block";

    element.style.position =
        "absolute";

    element.style.top =
        "0";

    element.style.height =
        "100%";

    element.style.width =
        "50%";

    if(side === "left") {

        element.style.left =
            "0";

        element.style.right =
            "auto";

    } else {

        element.style.right =
            "0";

        element.style.left =
            "auto";

    }
}


/* =========================================================
   INITIAL COVER
========================================================= */

const leftPage =
    document.getElementById("left-page");

const rightPage =
    document.getElementById("right-page");

const closedCover =
    document.getElementById("closed-cover");

const sheetsContainer =
    document.getElementById("sheets");


renderPage(leftPage, pages[0], "left");

rightPage.className =
    "page base-right blank-page";

rightPage.innerHTML = "";

closedCover.innerHTML =
    coverContent();


/* =========================================================
   CREATE PHYSICAL SHEETS
========================================================= */

const sheets = [];

let pageIndex = 1;


while(pageIndex < pages.length) {

    const sheet =
        document.createElement("div");

    sheet.className =
        "flip-sheet";

    sheet.style.zIndex =
        String(1000 - pageIndex);


    /* FRONT */

    const front =
        document.createElement("div");

    front.className =
        `sheet-front page ${
            pages[pageIndex].className
        }`;

    front.innerHTML =
        pages[pageIndex].content;


    /* BACK */

    const back =
        document.createElement("div");


    if(pageIndex + 1 < pages.length) {

        back.className =
            `sheet-back page ${
                pages[pageIndex + 1].className
            }`;

        back.innerHTML =
            pages[pageIndex + 1].content;

    } else {

        back.className =
            "sheet-back page blank-page";

        back.innerHTML = "";

    }


    sheet.appendChild(front);
    sheet.appendChild(back);

    sheetsContainer.appendChild(sheet);

    sheets.push(sheet);

    pageIndex += 2;
}


/* =========================================================
   NAVIGATION
========================================================= */

const nextButton =
    document.getElementById("next");

const previousButton =
    document.getElementById("previous");

const status =
    document.getElementById("status");


let currentSpread = 0;
let isCoverClosed = true;
const openingTime =
    new Date(2026, 9, 3, 0, 0, 0).getTime();

const countdownDisplay =
    document.getElementById("cover-countdown");

const countdownLabel =
    document.getElementById("cover-countdown-label");

const lastSpread =
    Math.floor((pages.length - 1) / 2);


function updateSheetStack() {

    sheets.forEach((sheet, index) => {

        sheet.style.zIndex =
            String(
                index < currentSpread
                    ? 100 + index
                    : 1000 - index
            );

    });
}


function scheduleSheetRestack(sheet) {

    let restacked = false;

    const restack = () => {

        if(restacked)
            return;

        restacked = true;

        updateSheetStack();

    };

    sheet.addEventListener(
        "transitionend",
        restack,
        { once: true }
    );

    window.setTimeout(restack, 1100);
}


function updateStatus() {

    previousButton.disabled =
        isCoverClosed;

    nextButton.disabled =
        isCoverClosed
            ? Date.now() < openingTime
            : currentSpread >= lastSpread;


    if(isCoverClosed) {

        status.textContent =
            "Cover";

        return;
    }


    if(currentSpread === 0) {

        status.textContent =
            `${pages[0].name} / ${pages[1].name}`;

        return;
    }


    if(currentSpread >= sheets.length) {

        status.textContent =
            pages[
                Math.min(
                    currentSpread * 2,
                    pages.length - 1
                )
            ].name;

        return;
    }


    const leftIndex =
        currentSpread * 2;

    const rightIndex =
        currentSpread * 2 + 1;

    const current =
        pages[
            Math.min(
                leftIndex,
                pages.length - 1
            )
        ];

    const next =
        pages[
            Math.min(
                rightIndex,
                pages.length - 1
            )
        ];


    if(next && next.name !== "Blank") {

        status.textContent =
            `${current.name} / ${next.name}`;

    } else {

        status.textContent =
            current.name;

    }
}


function updateCountdown() {

    const remaining =
        Math.max(0, openingTime - Date.now());

    let remainingSeconds =
        Math.ceil(remaining / 1000);

    const days =
        Math.floor(remainingSeconds / 86400);

    remainingSeconds %= 86400;

    const hours =
        Math.floor(remainingSeconds / 3600);

    remainingSeconds %= 3600;

    const minutes =
        Math.floor(remainingSeconds / 60);

    const seconds =
        remainingSeconds % 60;

    countdownDisplay.textContent =
        [days, hours, minutes, seconds]
            .map(value => String(value).padStart(2, "0"))
            .join(" : ");

    countdownLabel.textContent =
        remaining === 0
            ? "Your book is ready"
            : "The book opens in";

    updateStatus();
}


/* =========================================================
   NEXT
========================================================= */

function nextPage() {

    if(isCoverClosed) {

        if(Date.now() < openingTime) {

            updateCountdown();

            return;

        }

        isCoverClosed = false;

        closedCover.classList.add("opened");

        updateStatus();

        return;
    }


    if(currentSpread >= lastSpread)
        return;


    const sheet = sheets[currentSpread];

    sheet.style.zIndex = "2000";

    scheduleSheetRestack(sheet);

    sheet.classList.add("flipped");


    currentSpread++;

    updateStatus();
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousPage() {

    if(currentSpread <= 0) {

        if(!isCoverClosed) {

            isCoverClosed = true;

            closedCover.classList.remove("opened");

            updateStatus();

        }

        return;
    }


    currentSpread--;

    const sheet = sheets[currentSpread];

    sheet.style.zIndex = "2000";

    scheduleSheetRestack(sheet);

    sheet.classList.remove("flipped");


    updateStatus();
}


/* =========================================================
   BUTTONS
========================================================= */

nextButton.addEventListener(
    "click",
    nextPage
);

previousButton.addEventListener(
    "click",
    previousPage
);


closedCover.addEventListener(
    "click",
    event => {
        event.stopPropagation();

        if(isCoverClosed)
            nextPage();
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "ArrowRight")
            nextPage();

        if(event.key === "ArrowLeft")
            previousPage();

    }
);


/* =========================================================
   CLICK LEFT / RIGHT
========================================================= */

document
.querySelector(".book-binding")
.addEventListener(
    "click",
    event => {

        if(
            event.target.closest(
                ".navigation-dock"
            )
        )
            return;


        const rect =
            event.currentTarget
            .getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        if(
            x > rect.width / 2
        )
            nextPage();

        else
            previousPage();

    }
);


/* =========================================================
   SWIPE
========================================================= */

let touchStart = 0;


document.addEventListener(
    "touchstart",
    event => {

        touchStart =
            event.changedTouches[0]
            .screenX;

    }
);


document.addEventListener(
    "touchend",
    event => {

        const touchEnd =
            event.changedTouches[0]
            .screenX;


        const distance =
            touchEnd - touchStart;


        if(distance < -60)
            nextPage();


        if(distance > 60)
            previousPage();

    }
);


/* =========================================================
   START
========================================================= */

updateCountdown();

window.setInterval(updateCountdown, 1000);

</script>
